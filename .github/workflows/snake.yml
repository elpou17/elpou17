name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate customized snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: elpou17
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23a855f7&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
