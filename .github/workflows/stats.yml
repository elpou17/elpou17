name: Generate GitHub Stats Card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub statistics SVG
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=elpou17&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&theme=dracula&locale=en&hide_border=false
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Publish statistics SVG
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
